async function buildPdf(html){PV=[];toast('جاري تجهيز PDF...');
 try{if(!window.html2canvas)await ld(LIBS[0]);if(!window.jspdf)await ld(LIBS[1])}catch(e){return toast('يحتاج نت لتجهيز PDF أول مرة (مرة واحدة فقط)')}
 const h=document.createElement('div');h.style.cssText='position:fixed;left:-9999px;top:0;width:595px;background:#fff;color:#111;direction:rtl;font-family:Cairo,Tahoma,sans-serif';h.innerHTML=html;document.body.appendChild(h);
 try{const hb=h.getBoundingClientRect().top,B=[...h.querySelectorAll('tr')].map(r=>Math.round((r.getBoundingClientRect().bottom-hb)*2)),c=await html2canvas(h,{scale:2,backgroundColor:'#fff'}),pdf=new window.jspdf.jsPDF('p','pt','a4'),W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight(),ph=Math.floor(c.width*H/W);
  for(let y=0,i=0;y<c.height;i++){let e=y+ph;if(e>=c.height)e=c.height;else{const k=B.filter(b=>b>y+ph*.5&&b<=e);if(k.length)e=Math.max(...k)}
   const p=document.createElement('canvas');p.width=c.width;p.height=e-y;const x=p.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,p.width,p.height);x.drawImage(c,0,y,c.width,e-y,0,0,c.width,e-y);if(i)pdf.addPage();{const u=p.toDataURL('image/jpeg',.92);PV.push(u);pdf.addImage(u,'JPEG',0,0,W,p.height*W/c.width)};y=e}
  var out=pdf.output('blob')}catch(e){toast('تعذر إنشاء PDF');return null}finally{h.remove()}
 return out}
