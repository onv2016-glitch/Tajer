<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التاجر الحر</title>
<meta name="theme-color" content="#1f7a3f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f3f6f0;--card:#fff;--tx:#1c2a1f;--mut:#69786b;--pri:#1f7a3f;--ptx:#fff;--bd:#dce4d8;--pos:#16813f;--neg:#c62828;--in:#f7faf5}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121813;--card:#1b241d;--tx:#e8efe8;--mut:#9aab9c;--pri:#3fae6a;--ptx:#08130b;--bd:#2c382e;--pos:#5fd68a;--neg:#ff7b72;--in:#151d17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121813;--card:#1b241d;--tx:#e8efe8;--mut:#9aab9c;--pri:#3fae6a;--ptx:#08130b;--bd:#2c382e;--pos:#5fd68a;--neg:#ff7b72;--in:#151d17;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;padding-bottom:84px;font-size:16px}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:16px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;border:0;border-radius:10px;padding:13px;background:var(--pri);color:var(--ptx);font-weight:700;width:100%;margin-top:12px}
button.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.sm{width:auto;padding:6px 12px;margin:0}
.big{font-size:24px;font-weight:800}.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;margin:0;border-radius:0;background:transparent;color:var(--mut);padding:13px 2px;font-size:12px}
nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--pri)}
.li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);gap:8px}
.li:last-child{border:0}.li small{color:var(--mut);display:block}
.x{background:none;color:var(--neg);width:auto;padding:4px 10px;margin:0;font-size:18px}
.seg{display:flex;gap:6px}.seg button{margin:0;padding:9px}.seg button:not(.on){background:transparent;color:var(--tx);border:1px solid var(--bd)}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-weight:600}
#t{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--pri);color:var(--ptx);padding:10px 18px;border-radius:20px;font-weight:700;display:none;z-index:9}
#m{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}#m .card{width:100%;max-width:360px;max-height:90vh;overflow:auto;text-align:center;margin:0}
.warn{background:var(--in);border:1px solid var(--neg);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
</style>
</head>
<body>
<main id="app"></main><div id="t"></div><div id="m"></div><nav id="nav"></nav>
<script>
const K='hisbat_v1',$=id=>document.getElementById(id);
const DEF='طماط كبير،طماط وسط،كوسه،خيار،بارد أخضر،بارد أحمر،بارد أصفر،حار حلو،حار هندي،حار وسط،أسود،باميا،بروكلي،فاصوليا،لوبيا،زهرة،شمندر،قرع،ملفوف،بطاطس،خس،جزر،ثوم،عنب،بصل أحمر،بصل أبيض،كراث،ليمون،رمان،شمام،تمر برحي،تين';
let S,tab='inv',pt='day',po=0,sel=null,vk='q',vp='',PL=[];
let HAD=null,RDY=true;try{HAD=localStorage.getItem(K);S=JSON.parse(HAD)}catch(e){}
RDY=!!HAD;
if(!S||!S.items)S={items:DEF.split('،').map(n=>({n,p:1,b:''})),sales:[]};
function norm(){S.sales=S.sales||[];S.vch=S.vch||[];S.exp=S.exp||[];S.n=S.n||{i:1,q:1,s:1};S.me=S.me||{name:'',ph:''};S.draft=S.draft||{d:'',shop:'',lines:[]};S.offs=S.offs||[];S.shops=S.shops||[];
 const m={};S.sales.filter(r=>!r.inv).sort((a,b)=>a.d.localeCompare(b.d)||a.id-b.id).forEach(r=>{const k=r.shop+'|'+r.d;m[k]=m[k]||S.n.i++;r.inv=m[k]});
 (S.pays||[]).forEach(p=>{const k=p.k=='shop'?'q':'s';S.vch.push({id:p.id,k,no:S.n[k]++,d:p.d,w:p.w,a:p.a,m:'cash',r:0})});delete S.pays;
 if(!S.nl){S.sales.forEach(r=>{if(r.shop&&!S.shops.includes(r.shop))S.shops.push(r.shop);if(r.off&&!S.offs.includes(r.off))S.offs.push(r.off)});S.nl=1}}
norm();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
/* نسخة ثانية من البيانات في IndexedDB (احتياط إذا مسح المتصفح localStorage) */
const IDB={db:null,open(){return new Promise((ok,no)=>{try{const q=indexedDB.open('tajer',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>ok(q.result);q.onerror=()=>no()}catch(e){no()}})},
 async put(v){try{this.db=this.db||await this.open();this.db.transaction('kv','readwrite').objectStore('kv').put(v,'S')}catch(e){}},
 async get(){try{this.db=this.db||await this.open();return await new Promise(ok=>{const q=this.db.transaction('kv').objectStore('kv').get('S');q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})}catch(e){return null}}};
const save=()=>{const t=JSON.stringify(S);try{localStorage.setItem(K,t)}catch(e){toast('تعذر الحفظ')}if(RDY)IDB.put(t)};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=n=>(Math.round(n*100)/100).toLocaleString('en-US'),sg=n=>(n>0?'+':'')+f(n),cl=n=>n<0?'neg':n>0?'pos':'';
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hj=d=>new Date(d+'T00:00:00').toLocaleDateString('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'});
const vno=v=>(v.k=='q'?'ق-':'ص-')+String(v.no).padStart(3,'0');
function toast(m){const t=$('t');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function ask(m,fn){const e=$('m');e.innerHTML=`<div class="card"><p>${m}</p><div class="row"><button class="alt" onclick="$('m').style.display='none'">إلغاء</button><button id="ok" style="background:var(--neg);color:#fff">تأكيد</button></div></div>`;e.style.display='flex';$('ok').onclick=()=>{e.style.display='none';fn()}}
async function shareTxt(x){try{if(navigator.share){await navigator.share({text:x});return}}catch(e){if(e&&e.name=='AbortError')return}try{await navigator.clipboard.writeText(x);toast('تم النسخ ✓')}catch(e){toast('تعذر النسخ')}}
const T=[['inv','فاتورة'],['off','المكاتب'],['shp','التجار'],['vch','السندات'],['rep','التقارير'],['set','الأصناف']];
function go(t){if(t!=tab)po=0;tab=t;sel=null;if(t!='inv')LI=null;render()}
function render(){$('nav').innerHTML=T.map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 $('app').innerHTML=({inv:vInv,off:()=>vSt('off'),shp:()=>vSt('shop'),vch:vVch,rep:vRep,set:vSet})[tab]();document.querySelectorAll('#app input').forEach(i=>i.enterKeyHint=['s','va','vph'].includes(i.id)?'done':'next');if(tab=='inv')calc()}
/* الحسابات */
const acc=(t,n,a,z)=>{const u=t=='shop'?'s':'b',k=t=='shop'?'q':'s',g=t=='shop'?'shop':'off',R=S.sales.filter(r=>r[g]==n),V=S.vch.filter(v=>v.k==k&&v.w==n),
 sm=(L,fn)=>L.filter(r=>!r.x).reduce((s,r)=>s+fn(r),0),LX=R.filter(r=>r.d>=a&&r.d<=z),PX=V.filter(v=>v.d>=a&&v.d<=z),
 open=sm(R.filter(r=>r.d<a),r=>r.q*r[u])-sm(V.filter(v=>v.d<a),v=>v.a),bill=sm(LX,r=>r.q*r[u]),paid=sm(PX,v=>v.a);
 return{u,LX,PX,open,bill,paid,rem:Math.round((open+bill-paid)*100)/100}};
const RNG=()=>{const b=new Date();b.setHours(0,0,0,0);let a,z;
 if(pt=='day'){b.setDate(b.getDate()+po);a=z=b}
 else if(pt=='week'){b.setDate(b.getDate()-(b.getDay()+1)%7+po*7);a=b;z=new Date(b);z.setDate(z.getDate()+6)}
 else if(pt=='month'){a=new Date(b.getFullYear(),b.getMonth()+po,1);z=new Date(a.getFullYear(),a.getMonth()+1,0)}
 else{a=new Date(b.getFullYear()+po,0,1);z=new Date(b.getFullYear()+po,11,31)}
 return[iso(a),iso(z)]};
const pbar=()=>{const[a,z]=RNG();return`<div class="seg">${[['day','يوم'],['week','أسبوع'],['month','شهر'],['year','سنة']].map(([k,l])=>`<button class="${pt==k?'on':''}" onclick="pt='${k}';po=0;render()">${l}</button>`).join('')}</div><div class="top" style="margin:10px 0"><button class="sm alt" onclick="po--;render()">›</button><b>${a==z?a:a+' ← '+z}</b><button class="sm alt" onclick="po++;render()">‹</button></div>`};
/* إنشاء فاتورة */
function bkWarn(){const d=S.lastBackup||0;if(!S.sales.length||Date.now()-d<6048e5)return'';return`<div class="warn">⚠️ ${d?'مضى أكثر من أسبوع على آخر نسخة احتياطية.':'ما أخذت نسخة احتياطية بعد.'} <b onclick="go('set')" style="text-decoration:underline">خذ نسخة الآن</b></div>`}
function vInv(){const D=S.draft,td=iso(new Date());if(!D.d||(!D.lines.length&&D.t!=td))D.d=td;D.t=td;const tb=D.lines.reduce((a,r)=>a+r.q*r.b,0),ts=D.lines.reduce((a,r)=>a+r.q*r.s,0),n=(id,l,c)=>`<div><label>${l}</label><input id="${id}" type="number" inputmode="decimal" oninput="calc('${c}')"></div>`;
 return bkWarn()+(LI?`<div class="card">✅ تم حفظ الفاتورة رقم ${LI.n} (${esc(LI.shop)})<button onclick="pdfInv(LI.n,'shop',LI.shop)">📄 فاتورة PDF للتاجر</button></div>`:'')+`<h1>إنشاء فاتورة</h1><div class="card"><div class="row"><div><label>التاريخ</label><input type="date" value="${D.d}" onchange="S.draft.d=this.value;save()"></div><div><label>التاجر</label>${dd(S.shops,D.shop,'trd','shop')}</div></div>
 <datalist id="shops">${S.shops.map(o=>`<option value="${esc(o)}">`).join('')}</datalist><datalist id="offs">${S.offs.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>
 <label>المكتب / الدلال</label>${dd(S.offs,D.off,'off','off')}
 <label>الصنف</label><select id="item" onchange="pick()"><option value="">اختر الصنف</option>${S.items.map(i=>`<option>${esc(i.n)}</option>`).join('')}</select>
 <div class="row">${n('q','عدد الفلين','q')}${n('b','سعر شراء الفلين','b')}</div><div class="row">${n('p','مكسبك على الفلين','p')}${n('s','سعر بيع الفلين','s')}</div>
 <div class="li" style="margin-top:8px"><span>إجمالي الشراء (للمكتب)</span><b id="tb">0</b></div><div class="li"><span>إجمالي البيع (للتاجر)</span><b id="ts">0</b></div>
 <button onclick="addLine()">＋ إضافة</button></div>`+(D.lines.length?`<div class="card">${D.lines.map((r,i)=>`<div class="li"><div>${esc(r.item)}<small>${f(r.q)} فلين${r.off?' · '+esc(r.off):''}</small></div><div><small>شراء ${f(r.q*r.b)}</small><b>بيع ${f(r.q*r.s)}</b></div><button class="x" onclick="S.draft.lines.splice(${i},1);save();render()">×</button></div>`).join('')}<div class="li"><b>إجمالي الشراء</b><b>${f(tb)}</b></div><div class="li"><b>إجمالي البيع</b><b>${f(ts)}</b></div><button onclick="saveInv()">حفظ الفاتورة</button></div>`:'')}
function pick(){const it=S.items.find(i=>i.n==$('item').value);if(it){$('b').value=it.b;$('p').value=it.p;calc('b')}}
function calc(c){const v=i=>parseFloat($(i).value),b=v('b')||0;
 if(c=='s')$('p').value=isNaN(v('s'))?'':Math.round((v('s')-b)*100)/100;
 else if(c=='b'||c=='p')$('s').value=$('b').value===''?'':Math.round((b+(v('p')||0))*100)/100;
 $('tb').textContent=f((v('q')||0)*b);$('ts').textContent=f((v('q')||0)*(v('s')||0))}
function addLine(){const v=i=>parseFloat($(i).value),item=$('item').value,b=v('b'),q=v('q');
 if(!item)return toast('اختر الصنف');if(!(q>0))return toast('اكتب عدد الفلين');if(isNaN(b))return toast('اكتب سعر الشراء');
 const s=isNaN(v('s'))?b+(v('p')||0):v('s'),off=$('off').value.trim(),
 go=()=>{S.draft.lines.push({item,q,b,s,off});if(off&&!S.offs.includes(off))S.offs.push(off);const it=S.items.find(i=>i.n==item);if(it){it.b=b;it.p=Math.round((s-b)*100)/100}save();render();toast('تمت الإضافة')};
 if(s<b)return ask(`سعر البيع (${f(s)}) أقل من سعر الشراء (${f(b)}) — خسارة ${f((b-s)*q)} ريال. إضافة رغم ذلك؟`,go);go()}
function saveInv(){const D=S.draft,sh=D.shop.trim();if(!sh)return toast('اكتب اسم التاجر');const n=S.n.i++;
 D.lines.forEach((r,i)=>S.sales.push({id:Date.now()+i,inv:n,d:D.d,shop:sh,...r}));if(!S.shops.includes(sh))S.shops.push(sh);
 S.draft={d:D.d,t:D.t,shop:'',lines:[]};LI={n,shop:sh};save();render();toast('تم حفظ الفاتورة رقم '+n)}
/* كشف الحساب */
function vSt(t){const sh=t=='shop',col=sh?'pos':'neg',cc=sh?'neg':'pos',rt=m=>m>0.005?f(m):m<-0.005?'زيادة '+f(-m):'مسدد ✓',[a,z]=RNG();
 if(sel===null){const N=[...new Set(S.sales.filter(r=>!r.x).map(r=>sh?r.shop:r.off).filter(Boolean))].map(n=>[n,acc(t,n,'0','9')]).sort((x,y)=>y[1].rem-x[1].rem);PL=N.map(x=>x[0]);
  return`<h1>${sh?'كشف حساب التجار':'كشف حساب المكاتب والدلالة'}</h1><div class="card" style="text-align:center"><small class="mut">${sh?'إجمالي المتبقي لك عند التجار':'إجمالي المتبقي عليك للمكاتب'}</small><div class="big ${col}">${f(N.reduce((s,x)=>s+x[1].rem,0))} ريال</div></div>`+(N.length?`<div class="card">${N.map(([n,x],i)=>`<div class="li" onclick="sel=PL[${i}];render()" style="cursor:pointer"><b>${esc(n)}</b><b class="${x.rem>0.005?col:x.rem<-0.005?cc:''}">${rt(x.rem)} ‹</b></div>`).join('')}</div>`:'<div class="card">ما فيه بيانات بعد.</div>')}
 const c=acc(t,sel,a,z),st=x=>x?'text-decoration:line-through;opacity:.5':'';
 return`<div class="top"><h1>${esc(sel)}</h1><button class="sm alt" onclick="sel=null;render()">رجوع</button></div>${pbar()}
 <div class="card"><div class="li"><span>الرصيد السابق</span><b>${f(c.open)}</b></div><div class="li"><span>فواتير الفترة</span><b>${f(c.bill)}</b></div><div class="li"><span>${sh?'المقبوض':'المصروف'}</span><b>${f(c.paid)}</b></div><div class="li"><b>المتبقي</b><b class="big ${c.rem>0.005?col:c.rem<-0.005?cc:'pos'}">${c.rem<-0.005?'زيادة '+f(-c.rem):f(c.rem)}</b></div>
 <div class="row"><button onclick="goV('${sh?'q':'s'}')">${sh?'سند قبض':'سند صرف'}</button><button class="alt" onclick="pdfSt('${t}')">📄 كشف PDF</button></div><button class="alt" onclick="shareSt('${t}')">💬 إرسال الكشف كنص</button>${acc(t,sel,'0','9').rem>0.005?`<button class="alt" style="color:var(--neg)" onclick="settle('${t}')">تصفية الحساب (سداد كامل)</button>`:''}</div>
 <div class="card wrap"><table><tr><th>التاريخ</th><th>فاتورة</th><th>الصنف</th><th>فلين</th><th>السعر</th><th>المبلغ</th><th></th></tr>${c.LX.map(r=>`<tr style="${st(r.x)}"><td>${r.d.slice(5)}</td><td><b onclick="pdfInv(${r.inv},'${t}',sel)" style="text-decoration:underline;cursor:pointer">${r.inv} 📄</b></td><td>${esc(r.item)}</td><td>${f(r.q)}</td><td>${f(r[c.u])}</td><td><b>${f(r.q*r[c.u])}</b></td><td>${r.x?'':`<button class="x" style="color:var(--tx)" onclick="editL(${r.id})">✎</button><button class="x" onclick="cancelL(${r.id})">×</button>`}</td></tr>`).join('')}</table></div>
 ${c.PX.length?'<h2>السندات</h2><div class="card">'+c.PX.map(v=>`<div class="li" style="${st(v.x)}"><span>${vno(v)} · ${v.d.slice(5)} · ${v.m=='bank'?'تحويل':'كاش'}${v.st?' · تصفية':''}</span><b>${f(v.a)}</b></div>`).join('')+'</div>':''}`}
function goV(k){vk=k;vp=sel;tab='vch';sel=null;render()}
function cancelL(id){ask('إلغاء هذا السطر؟ يبقى ظاهراً كملغى.',()=>{S.sales.find(r=>r.id==id).x=1;save();render()})}
function shareSt(t){const sh=t=='shop',[a,z]=RNG(),c=acc(t,sel,a,z),L=[`كشف حساب ${sh?'التاجر':'المكتب'}: ${sel}`,`الفترة: ${a} إلى ${z}`,'--------'];
 c.LX.filter(r=>!r.x).forEach(r=>L.push(`${r.d} | فاتورة ${r.inv} | ${r.item} | ${f(r.q)} × ${f(r[c.u])} = ${f(r.q*r[c.u])}`));
 c.PX.filter(v=>!v.x).forEach(v=>L.push(`${v.d} | ${vno(v)} | ${sh?'مقبوض':'مصروف'}: ${f(v.a)}`));
 L.push('--------',`الرصيد السابق: ${f(c.open)}`,`فواتير الفترة: ${f(c.bill)}`,`${sh?'المقبوض':'المصروف'}: ${f(c.paid)}`,`المتبقي: ${f(c.rem)} ريال`);if(S.me.name)L.push(`حرر بواسطة: ${S.me.name} ${S.me.ph}`);shareTxt(L.join('\n'))}
/* السندات */
function vVch(){const q=vk=='q',t=q?'shop':'off',rem=vp?acc(t,vp,'0','9').rem:0;
 return`<h1>سند القبض والصرف</h1><div class="seg"><button class="${q?'on':''}" onclick="vk='q';vp='';render()">سند قبض (من تاجر)</button><button class="${q?'':'on'}" onclick="vk='s';vp='';render()">سند صرف (لمكتب)</button></div>
 <div class="card" style="margin-top:12px"><label>${q?'التاجر':'المكتب / الدلال'}</label><select onchange="vp=this.value;render()"><option value="">اختر</option>${[...new Set([...(q?S.shops:S.offs),vp].filter(Boolean))].map(n=>`<option ${n==vp?'selected':''}>${esc(n)}</option>`).join('')}</select>${vp?`<small class="mut">المتبقي حالياً: ${f(rem)} ريال</small>`:''}
 <div class="row"><div><label>المبلغ</label><input id="va" type="number" inputmode="decimal"></div><div><label>الطريقة</label><select id="vm" onchange="$('vr').style.display=this.value=='bank'?'block':'none'"><option value="cash">كاش</option><option value="bank">تحويل بنكي</option></select></div></div>

function vIssue(full){const t=vk=='q'?'shop':'off';if(!vp)return toast('اختر الطرف');const r=acc(t,vp,'0','9').rem,a=full?r:parseFloat($('va').value);if(!(a>0))return toast('اكتب المبلغ');
 const go=()=>{S.me={name:$('vb').value.trim(),ph:$('vph').value.trim()};const v={id:Date.now(),k:vk,no:S.n[vk]++,d:$('vd').value||iso(new Date()),w:vp,a:Math.round(a*100)/100,m:$('vm').value,ref:$('vr').value.trim(),note:$('vn').value.trim(),by:S.me.name,ph:S.me.ph,r:Math.round((r-a)*100)/100};
  S.vch.push(v);save();render();toast('تم إصدار السند '+vno(v))},ex=a-Math.max(r,0);
 if(ex>0.005)return ask(`المبلغ أكبر من المتبقي بمقدار ${f(ex)} ريال، وسيصبح الرصيد ${vk=='q'?'لصالح التاجر':'لصالحك عند المكتب'}. متابعة؟`,go);go()}

function renName(k,i){const L=k=='shop'?S.shops:S.offs,e=$('m');e.innerHTML=`<div class="card"><p>تعديل الاسم</p><input id="rn" value="${esc(L[i])}"><div class="row"><button class="alt" onclick="$('m').style.display='none'">إلغاء</button><button onclick="doRen('${k}',${i})">حفظ</button></div></div>`;e.style.display='flex'}
function doRen(k,i){const L=k=='shop'?S.shops:S.offs,o=L[i],n=$('rn').value.trim();if(!n)return toast('اكتب الاسم');if(n==o){$('m').style.display='none';return}
 const run=()=>{const g=k=='shop'?'shop':'off',vv=k=='shop'?'q':'s';S.sales.forEach(r=>{if(r[g]==o)r[g]=n});S.vch.forEach(v=>{if(v.k==vv&&v.w==o)v.w=n});if(k!='shop')S.draft.lines.forEach(r=>{if(r.off==o)r.off=n});if(S.draft[g]==o)S.draft[g]=n;
  if(L.includes(n))L.splice(i,1);else L[i]=n;save();$('m').style.display='none';render();toast('تم التعديل ✓')};
 if(L.includes(n))ask('الاسم موجود مسبقاً. دمج الحسابين في حساب واحد؟',run);else run()}

 e.innerHTML=`<div class="card" style="text-align:right"><b>تعديل: ${esc(r.item)}</b><label>التاريخ</label><input id="ed_d" type="date" value="${r.d}"><div class="row"><div><label>عدد الفلين</label><input id="ed_q" type="number" inputmode="decimal" value="${r.q}"></div><div><label>سعر الشراء</label><input id="ed_b" type="number" inputmode="decimal" value="${r.b}"></div></div><label>سعر البيع</label><input id="ed_s" type="number" inputmode="decimal" value="${r.s}"><div class="row"><button class="alt" onclick="$('m').style.display='none'">إلغاء</button><button onclick="saveL(${id})">حفظ</button></div></div>`;e.style.display='flex'}
function saveL(id){const r=S.sales.find(x=>x.id==id),q=parseFloat($('ed_q').value),b=parseFloat($('ed_b').value),s=parseFloat($('ed_s').value),d=$('ed_d').value;if(!r||!(q>0)||isNaN(b)||isNaN(s)||!d)return toast('تأكد من القيم');Object.assign(r,{q,b,s,d});save();$('m').style.display='none';render();toast('تم التعديل ✓')}

function cancelX(id){ask('إلغاء هذا المصروف؟ يبقى ظاهراً كملغى.',()=>{S.exp.find(x=>x.id==id).x=1;save();render()})}
/* PDF */
let LI=null,PB=null;
const LIBS=['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'];
const ld=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
const tbl=(h,rs)=>`<table style="width:100%;border-collapse:collapse"><tr>${h.map(x=>`<th style="border:1px solid #ccc;background:#eef4ec;padding:6px;text-align:right">${x}</th>`).join('')}</tr>${rs.map(r=>`<tr>${r.map(x=>`<td style="border:1px solid #ccc;padding:6px">${x}</td>`).join('')}</tr>`).join('')}</table>`;
function mkDoc(title,no,d,body,me){const m=me||S.me;return`<div style="padding:28px;font-size:14px;line-height:1.8;background:#fff;color:#111"><div style="display:flex;justify-content:space-between;border-bottom:3px solid #1f7a3f;padding-bottom:10px;margin-bottom:14px"><div><div style="font-size:22px;font-weight:800;color:#1f7a3f">${esc(title)}</div>${no?`<div>رقم: <b>${esc(no)}</b></div>`:''}</div><div style="text-align:left"><div style="font-weight:700">${esc(m.name||'التاجر الحر')}</div><div dir="ltr">${esc(m.ph||'')}</div></div></div><div style="margin-bottom:10px">التاريخ: <b>${d}</b> — ${hj(d)}</div>${body}<div style="margin-top:30px;display:flex;justify-content:space-between;color:#444"><div>حرر بواسطة: ${esc(m.name||'')}</div><div>التوقيع: ____________</div></div></div>`}
async function makePdf(html,name){toast('جاري تجهيز PDF...');
 try{if(!window.html2canvas)await ld(LIBS[0]);if(!window.jspdf)await ld(LIBS[1])}catch(e){return toast('يحتاج نت لتجهيز PDF أول مرة (مرة واحدة فقط)')}
 const h=document.createElement('div');h.style.cssText='position:fixed;left:-9999px;top:0;width:595px;background:#fff;color:#111;direction:rtl;font-family:Cairo,Tahoma,sans-serif';h.innerHTML=html;document.body.appendChild(h);
 try{const hb=h.getBoundingClientRect().top,B=[...h.querySelectorAll('tr')].map(r=>Math.round((r.getBoundingClientRect().bottom-hb)*2)),c=await html2canvas(h,{scale:2,backgroundColor:'#fff'}),pdf=new window.jspdf.jsPDF('p','pt','a4'),W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight(),ph=Math.floor(c.width*H/W);
  for(let y=0,i=0;y<c.height;i++){let e=y+ph;if(e>=c.height)e=c.height;else{const k=B.filter(b=>b>y+ph*.5&&b<=e);if(k.length)e=Math.max(...k)}
   const p=document.createElement('canvas');p.width=c.width;p.height=e-y;const x=p.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,p.width,p.height);x.drawImage(c,0,y,c.width,e-y,0,0,c.width,e-y);if(i)pdf.addPage();pdf.addImage(p.toDataURL('image/jpeg',.92),'JPEG',0,0,W,p.height*W/c.width);y=e}
  PB={blob:pdf.output('blob'),name}}catch(e){return toast('تعذر إنشاء PDF')}finally{h.remove()}
 const e=$('m');e.innerHTML='<div class="card"><p>الـPDF جاهز ✓</p><button onclick="pdfShare()">📤 مشاركة (واتساب...)</button><button class="alt" onclick="pdfSave()">⬇ حفظ في الجوال</button><button class="alt" onclick="$(\'m\').style.display=\'none\'">إغلاق</button></div>';e.style.display='flex'}
async function pdfShare(){const fl=new File([PB.blob],PB.name+'.pdf',{type:'application/pdf'});try{if(navigator.canShare&&navigator.canShare({files:[fl]}))await navigator.share({files:[fl]});else pdfSave()}catch(e){if(!e||e.name!='AbortError')pdfSave()}}
function pdfSave(){const a=document.createElement('a');a.href=URL.createObjectURL(PB.blob);a.download=PB.name+'.pdf';document.body.appendChild(a);a.click();a.remove();toast('تم الحفظ ✓')}
function pdfV(id){const v=S.vch.find(x=>x.id==id),q=v.k=='q';makePdf(mkDoc(q?'سند قبض':'سند صرف',vno(v),v.d,`<div style="border:1px solid #ccc;border-radius:8px;padding:14px;font-size:16px">تم ${q?'استلام':'صرف'} مبلغ <b>${f(v.a)} ريال</b> ${q?'من التاجر':'للمكتب'} <b>${esc(v.w)}</b><br>الطريقة: ${v.m=='bank'?'تحويل بنكي'+(v.ref?' - '+esc(v.ref):''):'كاش'}${v.note?'<br>ملاحظة: '+esc(v.note):''}</div><div style="margin-top:12px;font-size:16px">المتبقي ${q?'عليه':'له'}: <b>${f(v.r)} ريال</b></div>`,{name:v.by,ph:v.ph}),vno(v))}
function pdfInv(n,t,w){const sh=t=='shop',u=sh?'s':'b',L=S.sales.filter(r=>r.inv==n&&!r.x&&(sh?r.shop==w:r.off==w));if(!L.length)return toast('لا توجد أصناف');const tot=L.reduce((s,r)=>s+r.q*r[u],0),rem=acc(t,w,'0',L[0].d).rem;
 makePdf(mkDoc(sh?'فاتورة':'فاتورة مشتريات',n,L[0].d,`<div style="margin-bottom:8px">${sh?'السيد / التاجر':'المكتب / الدلال'}: <b>${esc(w)}</b></div>`+tbl(['الصنف','فلين','سعر الفلين','المبلغ'],L.map(r=>[esc(r.item),f(r.q),f(r[u]),f(r.q*r[u])]))+`<div style="margin-top:10px;font-size:16px">إجمالي الفاتورة: <b>${f(tot)} ريال</b><br>${sh?'إجمالي المتبقي عليكم':'إجمالي المتبقي لكم'} حتى تاريخ هذه الفاتورة: <b>${f(rem)} ريال</b></div>`),'invoice-'+n)}
function pdfSt(t){const sh=t=='shop',[a,z]=RNG(),c=acc(t,sel,a,z),rows=c.LX.filter(r=>!r.x).map(r=>[r.d.slice(5),r.inv,esc(r.item),f(r.q),f(r[c.u]),f(r.q*r[c.u])]).concat(c.PX.filter(v=>!v.x).map(v=>[v.d.slice(5),vno(v),sh?'مقبوض':'مصروف','','',f(v.a)]));
 makePdf(mkDoc('كشف حساب','',iso(new Date()),`<div style="margin-bottom:8px">${sh?'التاجر':'المكتب'}: <b>${esc(sel)}</b> — الفترة: ${a} إلى ${z}</div>`+tbl(['التاريخ','رقم','الصنف','فلين','السعر','المبلغ'],rows)+`<div style="margin-top:10px;font-size:15px">الرصيد السابق: ${f(c.open)}<br>فواتير الفترة: ${f(c.bill)}<br>${sh?'المقبوض':'المصروف'}: ${f(c.paid)}<br><b>المتبقي: ${f(c.rem)} ريال</b></div>`),'statement-'+sel)}

function vRep(){const[a,z]=RNG(),rs=S.sales.filter(r=>!r.x&&r.d>=a&&r.d<=z),pf=r=>r.q*(r.s-r.b),bu=rs.reduce((s,r)=>s+r.q*r.b,0),se=rs.reduce((s,r)=>s+r.q*r.s,0),p=se-bu;const ex=S.exp.filter(x=>x.d>=a&&x.d<=z),et=ex.filter(x=>!x.x).reduce((s,x)=>s+x.a,0),net=p-et,td=iso(new Date()),xd=td>=a&&td<=z?td:a,
 xc=`<h2>المصاريف</h2><div class="card"><div class="row"><div><label>البند</label><input id="xt" list="exl" placeholder="نقل، عمالة..."></div><div><label>المبلغ</label><input id="xa" type="number" inputmode="decimal"></div></div><datalist id="exl"><option value="نقل"><option value="عمالة"><option value="رسوم سوق"><option value="تحميل وتنزيل"><option value="وقود"><option value="أخرى"></datalist><label>التاريخ</label><input id="xd" type="date" value="${xd}"><button onclick="addExp()">＋ إضافة مصروف</button>${ex.map(x=>`<div class="li" style="${x.x?'text-decoration:line-through;opacity:.5':''}"><div>${esc(x.t)}<small>${x.d}</small></div><b>${f(x.a)}</b>${x.x?'':`<button class="x" onclick="cancelX(${x.id})">×</button>`}</div>`).join('')}</div>`;
 const gp=k=>{const m={};rs.forEach(r=>{const x=m[r[k]||'—']=m[r[k]||'—']||{q:0,p:0};x.q+=r.q;x.p+=pf(r)});return Object.entries(m).sort((x,y)=>y[1].p-x[1].p)};
 const tb=(h,l)=>`<div class="card wrap"><table><tr><th>${h}</th><th>فلين</th><th>الربح</th></tr>${l.map(([n,x])=>`<tr><td>${esc(n)}</td><td>${f(x.q)}</td><td class="${cl(x.p)}"><b>${sg(x.p)}</b></td></tr>`).join('')}</table></div>`;
 return`<h1>التقارير</h1>${pbar()}<div class="card" style="text-align:center"><small class="mut">${net<0?'الخسارة':'صافي الربح'}</small><div class="big ${cl(net)}">${sg(net)} ريال</div><div class="li"><span>ربح المبيعات</span><b class="${cl(p)}">${sg(p)}</b></div><div class="li"><span>المصاريف</span><b class="${et?'neg':''}">${et?'-'+f(et):'0'}</b></div><div class="row"><div><small class="mut">الشراء</small><div><b>${f(bu)}</b></div></div><div><small class="mut">البيع</small><div><b>${f(se)}</b></div></div></div></div>`+(rs.length?`<h2>حسب الصنف</h2>${tb('الصنف',gp('item'))}<h2>حسب التاجر</h2>${tb('التاجر',gp('shop'))}<h2>حسب المكتب</h2>${tb('المكتب',gp('off'))}`:'<div class="card">ما فيه عمليات في هذي الفترة.</div>')+xc}

 <div class="card"><small class="mut">المكسب الافتراضي للفلين:</small>${S.items.map((i,x)=>`<div class="li"><span>${esc(i.n)}</span><span style="display:flex;gap:6px;align-items:center"><input type="number" inputmode="decimal" style="width:80px;padding:8px" value="${i.p}" onchange="S.items[${x}].p=parseFloat(this.value)||0;save()"><button class="x" onclick="delItem(${x})">×</button></span></div>`).join('')}</div>
 <h2>نسخة احتياطية</h2><div class="card"><small class="mut">بياناتك في هذا المتصفح فقط. آخر نسخة: ${S.lastBackup?new Date(S.lastBackup).toLocaleDateString('ar-SA-u-ca-gregory-nu-latn'):'لم تؤخذ بعد'}</small><button onclick="bkShare()">📤 إرسال نسخة احتياطية</button><textarea id="bk" rows="2" placeholder="الصق النسخة هنا للاسترجاع" style="margin-top:10px"></textarea><div class="row"><button class="alt" onclick="bkCopy()">نسخ النص</button><button class="alt" onclick="bkRestore()">استرجاع</button></div><label>أو من ملف</label><input type="file" accept=".json,.txt" onchange="bkFile(this)"></div><h2>مسح البيانات</h2><div class="card"><small class="mut">يمسح الفواتير والسندات والمصاريف والحسابات ويبدأ من جديد، ويستمر الترقيم من آخر رقم حتى لا تتكرر أرقام مستندات أُرسلت سابقاً. تبقى الأصناف وبياناتك الشخصية. خذ نسخة احتياطية قبل المسح إذا تحتاجها.</small><button style="background:var(--neg);color:#fff" onclick="wipe()">🗑️ مسح كل البيانات</button></div>`}
function wipe(){ask('مسح كل الفواتير والسندات والحسابات؟',()=>ask('تأكيد أخير: لا يمكن التراجع.',()=>{S.sales=[];S.vch=[];S.exp=[];S.offs=[];S.shops=[];S.draft={d:'',shop:'',lines:[]};S.lastBackup=0;S.items.forEach(i=>i.b='');LI=null;sel=null;save();render();toast('تم المسح')}))}
function addItem(){const n=$('ni').value.trim();if(!n)return toast('اكتب اسم الصنف');if(S.items.some(i=>i.n==n))return toast('الصنف موجود');S.items.push({n,p:parseFloat($('np').value)||0,b:''});save();render()}
function delItem(x){ask('حذف الصنف؟ (عملياتك تبقى)',()=>{S.items.splice(x,1);save();render()})}
function saveFile(n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download=n;document.body.appendChild(a);a.click();a.remove();toast('تم الحفظ ✓')}
async function bkShare(){S.lastBackup=Date.now();save();const t=JSON.stringify(S),n='backup-'+iso(new Date())+'.json';
 try{const fl=new File([t],n,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[fl]})){await navigator.share({files:[fl]});return toast('تم ✓')}if(navigator.share){await navigator.share({text:t});return toast('تم ✓')}}catch(e){if(e&&e.name=='AbortError')return}saveFile(n,t)}
function bkCopy(){S.lastBackup=Date.now();save();const t=JSON.stringify(S),ta=$('bk');ta.value=t;ta.select();const ok=()=>toast('تم النسخ ✓'),fb=()=>{try{document.execCommand('copy');ok()}catch(e){toast('حدد النص وانسخه يدوياً')}};try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}}
function bkFile(el){const fl=el.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{$('bk').value=r.result;bkRestore()};r.readAsText(fl)}
function bkRestore(){try{const o=JSON.parse($('bk').value);if(!o.items||!o.sales)throw 0;ask('سيتم استبدال البيانات الحالية. متأكد؟',()=>{S=o;norm();save();render();toast('تم الاسترجاع ✓')})}catch(e){toast('النسخة غير صحيحة')}}
document.addEventListener('keydown',e=>{const t=e.target;if(e.key!='Enter'||!t.matches('#app input,#app select')||t.type=='file')return;e.preventDefault();
 if(tab=='inv'&&t.id=='s')return addLine();if(tab=='vch'&&t.id=='vph')return vIssue();
 const F=[...document.querySelectorAll('#app input:not([type=file]),#app select')].filter(x=>!x.disabled&&x.offsetParent),i=F.indexOf(t);if(F[i+1])F[i+1].focus()});
$('m').addEventListener('click',e=>{if(e.target.id=='m')e.target.style.display='none'});
save();render();
if(!HAD)IDB.get().then(t=>{try{const o=t&&JSON.parse(t);if(o&&o.items&&o.sales&&o.sales.length){S=o;norm();save();render();toast('تم استرجاع بياناتك المحفوظة ✓')}}catch(e){}}).finally(()=>{RDY=true;save()});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});if(navigator.onLine)setTimeout(async()=>{try{if(!window.html2canvas)await ld(LIBS[0]);if(!window.jspdf)await ld(LIBS[1])}catch(e){}},4000)});

</script>
</body>
